name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        run: rustup target add aarch64-apple-darwin

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: cargo xtask package
        id: package
        run: |
          cargo xtask package --version "${{ steps.version.outputs.version }}" | tee /tmp/package.out
          {
            echo "zip_path=$(tail -n 2 /tmp/package.out | head -n 1)"
            echo "sha256=$(tail -n 1 /tmp/package.out)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.package.outputs.zip_path }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Update Cask
        run: |
          sed -i '' \
            -e "s/^  version \".*\"/  version \"${{ steps.version.outputs.version }}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${{ steps.package.outputs.sha256 }}\"/" \
            Casks/todo.rb

      - name: Commit updated Cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/todo.rb
          git commit -m "Casks/todo.rb: bump to ${{ github.ref_name }}"
          git push origin HEAD:main
