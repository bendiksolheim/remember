<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remember</title>
  <style>
    /* A copy of the macOS capture panel (swift/Sources/RememberMac/CaptureView.swift
       and SpotlightPanel.swift). That panel always renders dark on a .hudWindow
       material, whatever the system appearance, so this page does too. */
    :root {
      color-scheme: dark;
      --text: #fff;
      --secondary: rgba(235, 235, 245, 0.6);
      --divider: rgba(255, 255, 255, 0.1);
      --accent: #0a84ff;
      --red: #ff453a;
      --orange: #ff9f0a;
      /* ListColor slots as macOS dark-mode system colors (see ListColor.swift). */
      --Blue: #0a84ff; --Purple: #bf5af2; --Pink: #ff375f; --Orange: #ff9f0a; --Teal: #40cbe0;
      --Indigo: #5e5ce6; --Mint: #63e6e2; --Yellow: #ffd60a; --Cyan: #64d2ff;
      /* PanelMetrics */
      --panel-width: 680px;
      --row-height: 40px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); overflow-x: hidden;
      font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 60% 50% at 15% 20%, #ff7a59 0%, transparent 70%),
        radial-gradient(ellipse 55% 60% at 85% 25%, #c04fd8 0%, transparent 70%),
        radial-gradient(ellipse 70% 60% at 30% 95%, #2f6bff 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 90% 90%, #ffb347 0%, transparent 70%),
        linear-gradient(160deg, #3b2a7a, #1a2a6c 60%, #0f1a3d);
      background-attachment: fixed;
    }

    /* SpotlightPanel: top edge pinned to the top-third line, grows downward. */
    .desktop { min-height: 100%; padding: 34vh 16px 48px; }
    .panel {
      width: var(--panel-width); max-width: 100%; margin: 0 auto;
      border-radius: 14px; overflow: hidden;
      background: rgba(40, 40, 44, 0.62);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      backdrop-filter: blur(40px) saturate(180%);
      box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.18) inset, 0 0 0 0.5px rgba(0, 0, 0, 0.6),
        0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .divider { height: 1px; background: var(--divider); }

    .capture { display: flex; align-items: center; gap: 8px; padding: 16px 20px; }
    .capture input {
      flex: 1; min-width: 0; border: 0; outline: none; background: none; padding: 0;
      color: var(--text); font-family: inherit; font-size: 22px; line-height: 36px;
    }
    .capture input::placeholder { color: rgba(235, 235, 245, 0.3); }

    .chip {
      display: inline-flex; align-items: center; gap: 4px; flex: none;
      padding: 4px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap;
      color: var(--tint); background: color-mix(in srgb, var(--tint) 20%, transparent);
    }
    .chip svg { width: 12px; height: 12px; }
    button.chip { border: 0; font-family: inherit; cursor: pointer; }

    .pills { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 999px; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.2;
      color: var(--c); background: none; box-shadow: 0 0 0 1px var(--c) inset; border: 0;
    }
    .pill .key { font-size: 10px; opacity: 0.7; font-family: ui-rounded, -apple-system, system-ui, sans-serif; }
    .pill.selected { background: var(--c); color: var(--on); box-shadow: none; }

    .rows { overflow-y: auto; transition: height 0.2s ease-out; }
    .row {
      position: relative; display: flex; align-items: center; gap: 10px;
      height: var(--row-height); padding: 0 20px; font-size: 13px; outline: none;
      transition: opacity 0.2s ease-out; cursor: default;
    }
    .row.focused { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    .row.focused::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); }
    .row.completed { opacity: 0.55; }
    .row.completed .title { color: var(--secondary); text-decoration: line-through; }
    .row .check { display: flex; flex: none; padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; }
    .row.completed .check { color: var(--secondary); }
    .row .check svg { width: 16px; height: 16px; }
    .row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row input {
      flex: 1; min-width: 0; border: 0; outline: none; background: none; padding: 0;
      color: var(--text); font: inherit;
    }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="panel">
      <div class="capture">
        <input id="input" type="text" placeholder="Add a task…" aria-label="Add a task" autocomplete="off" spellcheck="false">
        <span id="badge"></span>
      </div>
      <div class="divider"></div>
      <div class="pills" id="pills"></div>
      <div class="divider" id="rows-divider" hidden></div>
      <div class="rows" id="rows"></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
