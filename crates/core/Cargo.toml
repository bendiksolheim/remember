[package]
name = "todo-core"
version.workspace = true
edition.workspace = true

[features]
testing = []

[dependencies]
dirs = "7.0.0"
loro = "1.13.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
proptest = "1.11.0"
tempfile = "3.27.0"
